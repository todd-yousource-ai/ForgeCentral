# enroll/Cargo.toml -- the Console-owned ZTP enrollment client (IP-CONSOLE-00-DEPLOY D.3a-console).
#
# A standalone Rust crate (NOT in the pnpm workspace), like sidecar/. It enrolls the Console's engine
# identity via service-key ZTP: a SOFTWARE P-384 key (torch-enroll is TPM-only and refuses software keys,
# so the Console owns this small client), operator MFA + step-ca mint + AIG registration, yielding the
# cert + key PEM the crypto sidecar presents on the engine leg. Uses the platform's AWS-LC crypto (rcgen's
# aws_lc_rs backend); no TPM. D.3a-console.1 lands the software keystore (keygen + CSR + PEM); the enroll
# protocol client + the provisioning wrapper are D.3a-console.2/.3.

[package]
name = "console-enroll"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
license = "LicenseRef-YouSource-Proprietary"
publish = false
description = "Console service-key ZTP enrollment client: a software-key identity for the crypto sidecar's engine leg."

[lib]
name = "console_enroll"
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
# P-384 keygen + PKCS#10 CSR generation. Force the AWS-LC backend (rcgen defaults to `ring`); the Console's
# software wire key is generated + the enrollment CSR signed on the platform's AWS-LC module, no TPM. `pem`
# for the CSR/key PEM export. (No x509-parser: it drags in a conflicting time pin, and D.3a-console.2 will
# verify the CSR end to end against the real enrollment service.)
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# Raw ECDSA-P384 signing over the SAME key (the DPoP proof that gets the cnf-bound token D.3a-console.2
# needs, and later the wire-plane TLS handshake). AWS-LC keeps the crypto posture; one key material
# (PKCS#8 DER) drives both rcgen (CSR/PEM) and aws-lc-rs (raw sign).
aws-lc-rs = "1"
# base64url (no-pad) for the JOSE/JWK encoding of the DPoP proof + the RFC 7638 JWK thumbprint (`jkt`). The
# canonical JWK + the JWT header/claims are hand-built (format!) so no JSON dependency is pulled in there.
base64 = "0.22"
# Parse the IdP's device-authorization + token JSON responses (RFC 8628). serde_json is the standard,
# minimal choice; the request bodies are hand-built form-urlencoded (no extra dep).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Blocking TLS client (AWS-LC) for the IdP device-grant calls. rustls forced onto its aws_lc_rs provider
# (keeps the crypto posture); webpki-roots supplies the public web PKI trust anchors for the IdP host.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
webpki-roots = "1"
# The shared CrucibleDB enrollment wire contract: the TRD-04a 16-byte frame header + the serde
# WireIdentity/WireEnroll handshake messages (cdb-wire, `handshake` feature only -- `io` would pull tokio;
# this client does blocking frame I/O itself) and DeviceAttestation (cdb-types). Byte-exact to the engine
# by construction. Pinned rev, git-fetched via the `github-crucible` insteadOf (like the sidecar).
cdb-wire = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "7f459214ec57065684ddaebfa6b1955356524955", default-features = false, features = ["handshake"] }
cdb-types = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "7f459214ec57065684ddaebfa6b1955356524955" }
# CBOR encode/decode of the wire payloads (the codec cdb-wire itself uses).
ciborium = "0.2"
# Parse the pinned enroll-CA PEM into trust anchors for the bootstrap TLS to the node.
rustls-pemfile = "2"
