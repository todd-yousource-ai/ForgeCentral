# ForgeCentral (YouSource Console) CI. The full TypeScript/Node quality gate runs via scripts/ci.sh
# (hygiene -> typecheck -> lint -> format -> test -> contract -> e2e -> audit -> licenses -> build).
# The gate self-detects the scaffold stage: until the workspace has member packages it runs the
# repo-hygiene checks only; once code lands it runs the full gate.
#
# The Console consumes the platform's typed contracts (@forge/contracts, generated from the engine DTO
# + the BFF OpenAPI). If contract generation needs read access to a private engine repo, add a
# CRUCIBLE_TOKEN repository secret; the workspace-install step maps it. Absent the secret the gate still
# runs everything that does not need it.
name: console-quality-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    # Hoist the optional secret into env: the `secrets` context is not allowed in an `if:` expression,
    # but `env` is. Absent the secret this is an empty string and the mapping step below is skipped.
    env:
      CRUCIBLE_TOKEN: ${{ secrets.CRUCIBLE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack (pnpm, pinned in package.json)
        run: corepack enable

      - name: Map the engine contract dep to the token (if configured)
        if: ${{ env.CRUCIBLE_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${CRUCIBLE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install the TPM system libraries (tss2) for the console-tpm build
        # console-tpm links the real tpm2-tss stack: tss-esapi -> tss-esapi-sys, whose build script
        # resolves the system `tss2-sys` library via pkg-config. The runner ships without it, so the
        # Rust gate's console-tpm compile fails ("Package 'tss2-sys' ... not found"). No TPM hardware is
        # needed to build -- the device tests are #[ignore]d -- only the dev libraries. libtss2-dev
        # provides tss2-sys.pc (and the esys/mu/tcti pkgconfig). Needs the runner's sudo, so it lives
        # here (not in the shared scripts/ci.sh, which must also run on already-provisioned dev boxes).
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev

      - name: Provision Playwright (browser + OS libraries) for the e2e stage
        # The runner has no browser or its shared libraries; --with-deps apt-installs them (needs the
        # runner's sudo, so it lives here, not in the shared scripts/ci.sh). The gate's e2e stage then
        # reuses the cached browser. Idempotent; the frozen install makes the playwright binary present.
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forge/console-spa exec playwright install --with-deps chromium

      - name: Run the gate
        run: bash scripts/ci.sh
