# cargo-deny policy for the Console AWS-LC crypto sidecar (CS.5).
#
# The gate enforced by `scripts/ci.sh`'s sidecar leg via `cargo deny check` (in CI, where cargo-deny is
# provisioned). Mirrors CrucibleDB/Torch deny.toml structure (CRAFTED_ENGINEERING_STANDARDS "License and
# Distribution"). The one allowed git source is the pinned CrucibleDB contract repo (cdb-mtls); every other
# git source, and any crates.io `*` version, is denied.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked  = "deny"
ignore  = []

[licenses]
version              = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",                # aws-lc-sys / aws-lc-fips-sys
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",                # header-isolated modules only, per CRAFTED standards
    "LicenseRef-YouSource-Proprietary",
]
# AGPL, GPL (any version), LGPL, and Commons Clause are not allowed and deny by default.

[[licenses.clarify]]
crate         = "console-crypto-sidecar"
expression    = "LicenseRef-YouSource-Proprietary"
license-files = []

[bans]
multiple-versions = "deny"
wildcards         = "deny"
allow-wildcard-paths = true
highlight         = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
deny = []
# Transitive major straddles the ecosystem has not unified (same set Torch triages on the shared
# rustls/tokio/aws-lc tree). Revisit on dependency bumps.
skip = [
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "getrandom" },
    { name = "untrusted" },
    { name = "rand_core" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# The pinned CrucibleDB contract crate cdb-mtls arrives via git; this is the ONLY allowed git source.
allow-git        = ["https://github.com/todd-yousource-ai/Crucible.git"]
