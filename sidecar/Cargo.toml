# sidecar/Cargo.toml -- the Console AWS-LC crypto sidecar (IP-CONSOLE-00-CRYPTO-SIDECAR).
#
# A standalone Rust crate (NOT in the pnpm workspace): the small Console-owned process that terminates the
# admin-plane TLS and originates the engine mTLS on the platform's AWS-LC module, so the Node BFF performs
# no TLS. CS.1 lands the scaffold + the fail-closed config + node-IP bind guard; the aws-lc-rs listeners
# (cdb-mtls git dep) arrive in CS.2/CS.3. Deps are pinned and minimal (Rust_Dev_Rules Section 8).

[package]
name = "console-crypto-sidecar"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
license = "LicenseRef-YouSource-Proprietary"
publish = false
description = "Console AWS-LC crypto sidecar: terminates admin TLS + originates engine mTLS so Node performs no TLS."

[[bin]]
name = "console-crypto-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The engine leg reuses CrucibleDB's CNSA 2.0 hybrid mTLS profile verbatim (TLS 1.3, X25519MLKEM768-only,
# client-auth) so the sidecar's :7878 handshake is byte-identical to the engine's. Pinned rev, git-fetched
# via the `github-crucible` insteadOf (same pattern as torch-core). Leaf crate: rustls + aws-lc-rs, no
# engine deps -- it does not pull the database.
cdb-mtls = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "5be841b38156645b884f68942d11088ae4a8c32b" }
# NOTE: keep this rev aligned with the [dev-dependencies] crdb edges below. Two revs of one repo are two
# distinct cargo sources, so a mismatch builds two copies of cdb-types into one process.

# The Forge bundle signer (FD.2). cdb-artifact carries `bundle_preimage_bytes` -- the one implementation
# the endpoint also verifies with, so producer and verifier agree structurally rather than by fixture --
# plus sha512 and the ML-DSA-87 signer. It used to live in torch-forge, which forced this producer to
# build the endpoint's repository just to agree on what bytes a signature covers, and CI could not fetch
# it; moving it to cdb-artifact left this tier depending on ONE private repo.
#
# The seam test also pins these cdb-types shapes against the vendored forge-dto schema
# (INV-CONSOLE-FORGE-CONTRACT-SEAM-GATED): the TypeScript half is generated from a schema copied off
# crdb main, and nothing else compares the two.
#
# Keep every crdb rev here identical: two revs of one repo are two distinct cargo sources, so a mismatch
# builds two copies of cdb-types into one process.
cdb-types = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "5be841b38156645b884f68942d11088ae4a8c32b" }
cdb-artifact = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "5be841b38156645b884f68942d11088ae4a8c32b" }
# The CSPRNG for seed generation, and the same FIPS-track provider cdb-artifact signs with. Already
# resolved transitively via cdb-artifact, so naming it direct does not add a package to the graph.
aws-lc-rs = "1.17"
[dev-dependencies]
# Test-only: mint a throwaway P-384 leaf so the terminator's floor + the engine leg can be proven against
# real rustls clients. The runtime crate never mints certs (the installer provisions the leaves).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# The seam test builds a PolicyVersionRef, whose PolicyId wraps a Uuid. Already resolved transitively
# via cdb-types, so naming it here does not add a package to the graph.
uuid = "1"

# The workspace-wide lint policy (mirrors the engine repos' Rust_Dev_Rules Section 13). Inlined here
# because this crate is a standalone Cargo project, not a member of a lint-bearing workspace.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
await_holding_lock = "deny"

[lints.rust]
unsafe_code = "forbid"
