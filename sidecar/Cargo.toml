# sidecar/Cargo.toml -- the Console AWS-LC crypto sidecar (IP-CONSOLE-00-CRYPTO-SIDECAR).
#
# A standalone Rust crate (NOT in the pnpm workspace): the small Console-owned process that terminates the
# admin-plane TLS and originates the engine mTLS on the platform's AWS-LC module, so the Node BFF performs
# no TLS. CS.1 lands the scaffold + the fail-closed config + node-IP bind guard; the aws-lc-rs listeners
# (cdb-mtls git dep) arrive in CS.2/CS.3. Deps are pinned and minimal (Rust_Dev_Rules Section 8).

[package]
name = "console-crypto-sidecar"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
license = "LicenseRef-YouSource-Proprietary"
publish = false
description = "Console AWS-LC crypto sidecar: terminates admin TLS + originates engine mTLS so Node performs no TLS."

[[bin]]
name = "console-crypto-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
# The engine leg reuses CrucibleDB's CNSA 2.0 hybrid mTLS profile verbatim (TLS 1.3, X25519MLKEM768-only,
# client-auth) so the sidecar's :7878 handshake is byte-identical to the engine's. Pinned rev, git-fetched
# via the `github-crucible` insteadOf (same pattern as torch-core). Leaf crate: rustls + aws-lc-rs, no
# engine deps -- it does not pull the database.
cdb-mtls = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "b51236b0607401cf578e87a9fcaa57fd44158108" }
# The client-side device-identity seam: the KeystoreBackend trait, the rustls TPM signer, and
# tpm_mtls_client_config (present a non-exportable TPM key on the engine mTLS leg). Same pinned rev.
cdb-device-identity = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "b51236b0607401cf578e87a9fcaa57fd44158108" }
# The concrete TPM backend, shared with console-enroll: the sidecar re-derives the SAME non-exportable key
# (the deterministic TPM primary) and signs the handshake in-device. Linux-only (links libtss2), so the
# sidecar is a Linux daemon by construction (it needs /dev/tpmrm0).
console-tpm = { path = "../console-tpm" }

[dev-dependencies]
# Test-only: mint a throwaway P-384 leaf so the terminator's floor can be proven against real rustls
# clients. The runtime crate never mints certs (the installer provisions the admin leaf).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
# Test-only: the DeviceAttestation return type for the no-op KeystoreBackend the engine build tests use.
cdb-types = { git = "https://github.com/todd-yousource-ai/Crucible.git", rev = "b51236b0607401cf578e87a9fcaa57fd44158108" }

# The workspace-wide lint policy (mirrors the engine repos' Rust_Dev_Rules Section 13). Inlined here
# because this crate is a standalone Cargo project, not a member of a lint-bearing workspace.
[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
await_holding_lock = "deny"

[lints.rust]
unsafe_code = "forbid"
